paths:
  sqlite_db: "/raven/data/raven.db"
  chroma_dir: "/raven/data/chroma"
  # User space root directory
  user_space: "/raven/data/users"
  # Frontend static files directory
  frontend_dir: "/raven/frontend"
  # Python scripts directory
  scripts: "/raven/scripts"
  # Hub skills cache directory - central storage for admin-managed skills before per-user install
  skills_hub: "/raven/data/skills_hub"
  # Upload directory for user file uploads
  upload_dir: "/raven/data/upload"
  # Skill dependency install records directory
  skill_installed_dir: "/raven/skill_installed"

other:
  listen_addr: ":8000"
  service_name: "raven"
  repository_request_timeout: 10
  prometheus_listen_addr: ":9090"
  # "fatal" "error" "warn" "info"  "debug"
  logger_level: "debug"
  # shutdown_second : Elegant lying off for the longest time
  shutdown_second: 3

behavior:
  # preview_user: when set to a valid user ID, skips login and runs as that user (preview/demo mode)
  preview_user: ""

tools:
  # HTTP 工具超时时间（秒），默认 60。用于 MCP HTTP 客户端、WebFetch 等
  http_timeout_seconds: 60

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0
  # 重试次数, 默认不重试
  max_retries: 0
  # 连接池大小
  pool_size: 32
  # 读取超时时间 3秒
  read_timeout: 3
  # 写入超时时间 3秒
  write_timeout: 3
  # 连接空闲时间 300秒
  idle_timeout: 300
  # 连接最长时间，300秒
  max_conn_age: 300
  # 如果连接池已满 等待可用连接的时间默认 8秒
  pool_timeout: 8

db:
  # SQLite: addr = "/raven/data/raven.db"
  # MySQL: addr = "user:password@tcp(host:port)/dbname?charset=utf8mb4&parseTime=True&loc=Local"
  # PostgreSQL: addr = "host=localhost user=postgres password=postgres dbname=raven port=5432 sslmode=disable"
  # Defaults to [paths].sqlite_db when empty.
  addr: ""
  max_open_conns: 4
  max_idle_conns: 2
  conn_max_life_time: 200
  conn_max_idle_time: 170

system:
  # language: "zh" for Chinese, "en" for English
  language: "zh"
  # initialized: whether the system has been initialized
  initialized: false
  # db_type: database type, supported values: sqlite, mysql, pg
  db_type: "sqlite"
  # cache_type: cache type, supported values: local, redis
  cache_type: "local"
