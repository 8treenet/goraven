<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- GoRaven — round little raven, transparent background -->
  <style>
    :root {
      color: #101828;
      --raven-amber: #d97706;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color: #f2f4f7;
        --raven-amber: #f5b544;
      }
    }
  </style>
  <defs>
    <mask id="raven-eye" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff" />
      <circle cx="48" cy="19" r="3" fill="#000" />
    </mask>
  </defs>
  <g fill="currentColor" mask="url(#raven-eye)">
    <ellipse cx="32" cy="38" rx="17" ry="14" />
    <circle cx="45" cy="23" r="11.5" />
    <path d="M20 36 2 48l7 7 15-8z" />
  </g>
  <path d="M55 19.5 64 24 55 28.5z" fill="var(--raven-amber)" />
  <g fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round">
    <path d="M27 50v5M37 50v5" />
  </g>
</svg>
